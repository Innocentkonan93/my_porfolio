<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Innocent Konan's Portfolio" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Innocent Konan" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Innocent Konan | Mobile & Web Developer</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f7f8fa" />
    <style>
      body { background: #f7f8fa; margin: 0; }
      .loading-container {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f7f8fa;
        color: #24231f;
        z-index: 9999;
        transition: opacity 400ms ease;
      }
      .loading-brand { text-align: center; }
      .loading-logo {
        font: 800 76px/1 Arial, sans-serif;
        letter-spacing: -7px;
        padding-right: 7px;
      }
      .loading-logo span { color: #6650a4; }
      .loading-name {
        margin: 24px 0 28px;
        font: 500 10px/1.5 Arial, sans-serif;
        letter-spacing: 4px;
        color: #777183;
      }
      .loading-track {
        width: 120px;
        height: 2px;
        margin: auto;
        overflow: hidden;
        border-radius: 2px;
        background: #e0dfe5;
      }
      .loading-track::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: #6650a4;
        animation: glide 1400ms ease-in-out infinite;
      }
      @keyframes glide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(325%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loading-track::after { animation: none; width: 100%; }
        .loading-container { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="loading-container" id="loading" role="status" aria-label="Chargement du portfolio">
      <div class="loading-brand">
        <div class="loading-logo" aria-hidden="true">ik<span>.</span></div>
        <div class="loading-name" aria-hidden="true">INNOCENT KONAN</div>
        <div class="loading-track" aria-hidden="true"></div>
      </div>
    </div>
    <script>
      // Keep the splash visible until Flutter has actually painted its first frame.
      window.addEventListener("flutter-first-frame", () => {
        const loading = document.getElementById("loading");
        if (!loading) return;
        loading.style.opacity = "0";
        loading.style.pointerEvents = "none";
        setTimeout(() => loading.remove(), 400);
      }, { once: true });
    </script>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
